spring.application.name=codemm
server.port=8080

# MySQL (XAMPP default). Override with environment variables if your setup differs.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dbcodemm?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.error.include-stacktrace=never

# Comma-separated list of front-end origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
